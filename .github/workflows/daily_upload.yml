name: Daily Video Upload Automation

on:
  schedule:
    # یہ شیڈول روزانہ دوپہر 12:00 بجے (UTC) چلے گا (آپ وقت تبدیل کر سکتے ہیں)
    - cron: '0 12 * * *'
  workflow_dispatch: # اس سے آپ GitHub کے پیج سے مینول (Manual) بھی بٹن دبا کر اسکرپٹ چلا سکتے ہیں

jobs:
  process-and-upload:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🎥 Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run Video Processing & Upload Script
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: python script.py

      - name: 💾 Commit and Push Changes (Update History & Remove Videos)
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add -A
          git commit -m "🤖 Auto-processed: updated history and cleaned up video files" || echo "No changes to commit"
          git push
