name: AI-Powered Auto Video Upload & Processing

on:
  # 🚀 1. فوری آٹو ٹریگر: جیسے ہی 'videos/' فولڈر میں کوئی نئی ویڈیو آئے گی، بوٹ اسی وقت چل پڑے گا
  push:
    paths:
      - 'videos/**'

  # 🕒 2. روزانہ کا شیڈول: بیک اپ کے طور پر روزانہ چیک کرے گا
  schedule:
    - cron: '0 12 * * *'

  # 🔘 3. مینول بٹن: گِٹ ہب پیج سے کسی بھی وقت مینوئلی رن کرنے کے لیے
  workflow_dispatch:

jobs:
  process-and-upload:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🎥 Install FFmpeg & OpenCV System Dependencies
        run: |
          sudo apt-get update
          # OpenCV اور FFmpeg کو سرور پر بغیر کسی ارر کے چلانے کے لیے ضروری لائبریریز
          sudo apt-get install -y ffmpeg libgl1 libglib2.0-0

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🤖 Run AI Video Processing & Upload Script
        env:
          # Make.com اور Google Gemini دونوں کی کیز (Keys) یہاں سیکیور طریقے سے پاس کی گئی ہیں
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python script.py

      - name: 💾 Commit and Push Changes (Update History & Delete Processed Videos)
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add -A
          git commit -m "🤖 Auto-processed: uploaded via AI, updated history & cleaned up storage" || echo "No changes to commit"
          
          # 🛡️ کسی بھی قسم کے Git Conflict سے بچنے کے لیے جدید سنک کمانڈ
          git pull origin main --rebase || git pull origin main
          
          git push
