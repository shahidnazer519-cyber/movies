name: Video Auto Upload
on: [push, workflow_dispatch]
jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg libgl1
          pip install requests google-generativeai opencv-python-headless Pillow ffmpeg-python
      - name: Run Script
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python script.py
      - name: Push Changes
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@bot.com"
          git add -A
          git commit -m "Auto Cleanup" || echo "No changes"
          git pull --rebase
          git push
